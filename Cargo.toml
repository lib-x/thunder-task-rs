[package]
name = "thunder-task-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Xunlei Pan task API client: OAuth device-flow login, authorized devices, download task management"
license = "MIT"
repository = "https://github.com/lib-x/thunder-task-rs"
keywords = ["xunlei", "thunder", "pan", "download", "nas"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["time", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
